apiVersion: v1
kind: Service
metadata:
  name: {{ include "store-chart.fullname" . }}-wordpress
  labels:
    {{- include "store-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: wordpress
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    {{- include "store-chart.wordpress.selectorLabels" . | nindent 4 }}
