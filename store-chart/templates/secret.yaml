apiVersion: v1
kind: Secret
metadata:
  name: {{ include "store-chart.fullname" . }}-mysql-secret
  labels:
    {{- include "store-chart.labels" . | nindent 4 }}
type: Opaque
data:
  mysql-root-password: {{ .Values.mysql.rootPassword | b64enc | quote }}
  mysql-password: {{ .Values.mysql.password | b64enc | quote }}
